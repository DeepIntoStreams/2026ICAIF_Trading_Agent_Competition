services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-competition}
      POSTGRES_USER: ${POSTGRES_USER:-competition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-competition}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - competition-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  schema-init:
    build:
      context: ..
      dockerfile: deployment/live_server/Dockerfile
    command: ["python", "data/database/init_db.py"]
    environment:
      COMPETITION_DATABASE_URL: postgresql://${POSTGRES_USER:-competition}:${POSTGRES_PASSWORD:-competition}@postgres:5432/${POSTGRES_DB:-competition}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  competition-postgres:
