services:
  competition-server:
    build:
      context: ..
      dockerfile: deployment/live_server/Dockerfile
    environment:
      COMPETITION_ADMIN_TOKEN: ${COMPETITION_ADMIN_TOKEN:?set COMPETITION_ADMIN_TOKEN}
      COMPETITION_DB: /data/competition.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - competition-data:/data
    restart: unless-stopped

volumes:
  competition-data:
