title: "ACM ICAIF 2026 Trading Agent Competition"
version: 2
description: competition/website/1_overview.md
registration_auto_approve: true
enable_detailed_results: true
docker_image: REPLACE_ME_EVALUATION_IMAGE

phases:
  1:
    phasenumber: 1
    label: "Development & Validation"
    start_date: 2026-10-01
    max_submissions: 240
    max_submissions_per_day: 10
    execution_time_limit: 3600
    is_scoring_only: false
    input_data: REPLACE_ME_VALIDATION_INPUT_KEY
    reference_data: REPLACE_ME_VALIDATION_REFERENCE_KEY
    ingestion_program: REPLACE_ME_INGESTION_PROGRAM_KEY
    scoring_program: REPLACE_ME_SCORING_PROGRAM_KEY
    starting_kit: REPLACE_ME_STARTING_KIT_KEY
  2:
    phasenumber: 2
    label: "Official Live Competition"
    start_date: 2026-10-27
    max_submissions: 20
    max_submissions_per_day: 3
    execution_time_limit: 300
    is_scoring_only: true
    scoring_program: REPLACE_ME_LIVE_RECEIPT_SCORER_KEY

leaderboard:
  leaderboards:
    RESULTS: &RESULTS
      label: Results
      rank: 1
  columns:
    receipt_accepted: {leaderboard: *RESULTS, label: Live Receipt, rank: 1, sort: desc}
    m1_cumulative_return: {leaderboard: *RESULTS, label: M1 Return, rank: 2, sort: desc}
    m2_daily_win_rate: {leaderboard: *RESULTS, label: M2 Win Rate, rank: 3, sort: desc}
    m3_sharpe_ratio: {leaderboard: *RESULTS, label: M3 Sharpe, rank: 4, sort: desc}
    m4_sortino_ratio: {leaderboard: *RESULTS, label: M4 Sortino, rank: 5, sort: desc}
    m5_maximum_drawdown: {leaderboard: *RESULTS, label: M5 MDD, rank: 6, sort: asc}
    m6_value_at_risk_95: {leaderboard: *RESULTS, label: M6 VaR95, rank: 7, sort: asc}
    m7_expected_shortfall_95: {leaderboard: *RESULTS, label: M7 ES95, rank: 8, sort: asc}
    m8_turnover: {leaderboard: *RESULTS, label: M8 Turnover, rank: 9, sort: asc}
    m9_violation_rate: {leaderboard: *RESULTS, label: M9 Violations, rank: 10, sort: asc}
