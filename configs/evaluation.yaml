evaluation:
  initial_cash: 1000000
  evaluation_days: 252
  pre_roll_days: 60
  fee_rate: 0.001
  execution_price: next_open
  valuation_price: close
  allow_fractional_shares: true

constraints:
  long_only: true
  max_asset_weight: 0.30
  max_gross_exposure: 1.00

privacy:
  expose_tickers: false
  expose_absolute_dates: false
  expose_absolute_prices: false
  expose_absolute_volumes: false
  expose_raw_fundamental_amounts: false
  permit_network_access: false
  permit_external_llm_api: false
  persist_raw_observations_in_agent_logs: false

agents:
  hybrid_rule:
    rebalance_frequency: 5
    max_positions: 8
    technical_weight: 0.70
    fundamental_weight: 0.30
    momentum_short_weight: 0.60
    momentum_long_weight: 0.40

  ppo:
    rebalance_frequency: 1
    checkpoint: models/ppo_checkpoint.pt

  llm:
    rebalance_frequency: 5
    model_name: "google/gemma-4-31B-it"
    temperature: 0.0
    base_url: "http://10.86.229.182:8000/v1"
    api_key: "unused"
