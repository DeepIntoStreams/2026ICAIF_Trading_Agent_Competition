evaluation:
  initial_cash: 1000000
  pre_roll_days: 60
  horizon_trading_days: 10
  seed: 1
  start_date:
  end_date:
  decision_minutes_before_close: 10
  fee_rate: 0.001
  slippage_bps: 0.0
  annualization: 252
  risk_free_rate: 0.0

constraints:
  long_only: true
  max_asset_weight: 0.30
  max_gross_exposure: 1.00

news:
  providers: ["finnhub"]
  data_dir: "data/news"
  max_items_per_decision: 40
  include_raw_text: true
  historical_backfill_mode: false
  final_poll_minutes_before_cutoff: 5

agents:
  enabled: ["hybrid", "ppo", "llm"]
  hybrid:
    news_weight: 0.20
    rebalance_frequency: 1
    max_positions: 8
  ppo:
    checkpoint_path:
    seed: 1
    news_beta: 0.30
    news_count_gamma: 0.05
  llm:
    base_url: "http://10.86.229.182:8000/v1"
    api_key: "unused"
    model: "google/gemma-4-31B-it"
    temperature: 0.0
    max_tokens: 4096
    timeout_seconds: 60.0
    rebalance_frequency: 1
