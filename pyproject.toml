[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-agent-project"
version = "0.1.0"
description = "Confidential walk-forward portfolio-agent evaluation utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
  "openai>=1.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
